<!doctype html><meta charset="utf-8"><title>TRI-040 Desert Rider sandbox</title>
<style>body{background:#211c17;color:#ffe5b3;font:16px monospace}canvas{background:#a8824e;max-width:100%}button{padding:12px}</style>
<h1>Desert Rider custom roster</h1><p>Custom authored canvas silhouettes; no recovered art, mission placements or audio. Reset starts a locked worm attack and crawler counter. Scout retreats from a bug; guard fires five pellets; mechanic repairs the damaged vehicle.</p>
<button id="reset">Reset demonstration</button><p id="status">Ready</p><canvas width="900" height="480"></canvas>
<script src="/navigation.js"></script><script src="/src/desert-worm.js"></script><script src="/src/desert-riders.js"></script><script>
const r=window.TriumphDesertRiders,w=window.TriumphDesertWorm,ctx=document.querySelector('canvas').getContext('2d');let actors=[],repairTarget,worm,bug,bullets=[],mines=[],time=0,last=0;
const blocked=(x,y)=>x<0||x>=900||y<0||y>=480||(x>=650&&x<=670&&y>=210),visible=(a,b)=>a.phase!=='burrow'&&b.phase!=='burrow';
function reset(){time=0;bullets=[];mines=[];actors=[r.create('rider-scout',130,100,blocked),r.create('dune-guard',350,100,blocked),r.create('field-mechanic',540,110,blocked),r.create('convoy-crawler',300,330,blocked,[{x:550,y:330}])];repairTarget=r.create('convoy-crawler',575,135,blocked);repairTarget.hp=3;worm=w.create(180,330,blocked);bug={x:170,y:100,team:'alien',type:'soldier',alive:true,hp:100};w.step(worm,1,{humans:[actors[3]],blocked,damage:(a,n)=>a.hp-=n});}reset();document.querySelector('#reset').onclick=reset;
function frame(ms){const dt=Math.min(.04,(ms-last)/1000);last=ms;time+=dt;const aliens=[worm,bug,{x:440,y:100,team:'alien',type:'soldier',alive:true,hp:100}];for(const a of actors)r.step(a,dt,{blocked,aliens,humans:[...actors,repairTarget],mines,visible,route:(u,p,b)=>window.TriumphNavigation.step(u,p,b,'sandbox'),shoot:p=>bullets.push(...p)});if(actors[1].cool<=0){bullets.push(...r.pellets(actors[1],{x:440,y:100}));actors[1].cool=r.rules.guardCooldown;}w.step(worm,dt,{humans:[actors[3]],blocked,damage:(a,n)=>a.hp-=n});r.updateMines(mines,dt,{aliens,blocked,visible,damage:(a,n)=>a.hp-=n,burst:()=>{}});for(const b of bullets){b.x+=b.dx*b.speed*dt;b.y+=b.dy*b.speed*dt;b.life-=dt;}bullets=bullets.filter(b=>b.life>0);ctx.clearRect(0,0,900,480);ctx.fillStyle='#403426';ctx.fillRect(650,210,20,270);actors.forEach(a=>r.draw(ctx,a));r.draw(ctx,repairTarget);w.draw(ctx,worm,time);ctx.fillStyle='#7c4236';ctx.fillRect(bug.x-6,bug.y-6,12,12);ctx.fillRect(434,94,12,12);ctx.fillStyle='#ffeab1';bullets.forEach(b=>ctx.fillRect(b.x,b.y,3,3));mines.forEach(m=>{ctx.fillStyle=m.age<r.rules.mineArm?'#dbc88d':'#cc653e';ctx.fillRect(m.x-4,m.y-4,8,8);});ctx.fillStyle='#241c13';['scout','five-pellet guard','mechanic','6 HP crawler'].forEach((label,i)=>ctx.fillText(label,actors[i].x-35,actors[i].y+30));document.querySelector('#status').textContent=`Worm ${worm.phase}; crawler HP ${actors[3].hp.toFixed(1)}; repair target HP ${repairTarget.hp.toFixed(1)}; crawler mines ${actors[3].mineAmmo}; active mines ${mines.length}; shotgun pellets in flight ${bullets.length}`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
