<text x="64" y="1003" font-family="Segoe UI,sans-serif" font-size="21" fill="#eaf1f6">Objective: activate both relays, then clear nests and all ground / transitioning enemies.</text>
<text x="64" y="1038" font-family="Segoe UI,sans-serif" font-size="18" fill="#adc0cc">Concept clearance only. Sightlines, collision masks, support delivery and balance require implementation tests.</text>
