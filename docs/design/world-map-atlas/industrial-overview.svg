e" font-size="12" font-weight="bold" fill="#15212e">P</text></g><g><circle cx="150" cy="620" r="24" fill="#185d8b" stroke="#fff" stroke-width="3"/><text x="150" y="627" text-anchor="middle" font-size="24" fill="white" font-family="sans-serif">D</text></g><rect width="1024" height="32" fill="#162839"/><text x="16" y="23" fill="#fff" font-family="sans-serif" font-size="18">Industrial / A · Conveyor braid — HUD reservation 0–31</text><rect y="768" width="1024" height="52" fill="#f3f4ed"/><text x="14" y="788" fill="#15212e" font-size="15" font-family="sans-serif">D deployment · C commanders · S infantry · SP specialist · RB robot · O terminal · R survivors · X exit · L relief</text><text x="14" y="809" fill="#15212e" font-size="15" font-family="sans-serif">N nest · E bug · T troops · TK tank · P plasma · V vent · A ambush · H heat · light clear / dark blocked · schematic</text></g><g transform="translate(512,48) scale(.5)"><title>Industrial B · Rail crossing</title><desc>Authored schematic. Blocking terrain surrounds clear route corridors; main teal solid, flank violet dashed. Diagonal rail transfer links the pressure and conveyor fronts before the outer loading spur. Rail crossing is visible from three bays; the southeastern terminal is a retreating spur.</desc><rect width="1024" height="768" fill="#39434b"/><g stroke="#b4a479" stroke-width="144" stroke-linecap="round"><path d="M160,390L420,390"/><path d="M420,390L420,170"/><path d="M420,170L800,170"/><path d="M420,390L650,390"/><path d="M650,390L800,170"/><path d="M650,390L650,620"/><path d="M650,620L870,620"/><path d="M420,170L650,620"/></g><g fill="#b4a479"><circle cx="160" cy="390" r="88"/><circle cx="420" cy="390" r="88"/><circle cx="420" cy="170" r="88"/><circle cx="800" cy="170" r="88"/><circle cx="650" cy="390" r="88"/><circle cx="650" cy="620" r="88"/><circle cx="870" cy="620" r="88"/></g><g stroke="#ffffff" stroke-opacity=".1" stroke-width="1"><path d="M128,32V768"/><path d="M256,32V768"/><path d="M384,32V768