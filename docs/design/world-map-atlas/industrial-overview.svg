 fill="white">N4</text></g><g><title>support T1</title><rect x="375" y="377" width="26" height="26" fill="#e5b33e" stroke="#15212e" stroke-width="2"/><text x="388" y="395" text-anchor="middle" font-size="12" font-weight="bold" fill="#15212e">T1</text></g><g><title>support TK</title><rect x="669" y="377" width="26" height="26" fill="#e5b33e" stroke="#15212e" stroke-width="2"/><text x="682" y="395" text-anchor="middle" font-size="12" font-weight="bold" fill="#15212e">TK</text></g><g><title>weapon P</title><rect x="439" y="377" width="26" height="26" fill="#a086ce" stroke="#15212e" stroke-width="2"/><text x="452" y="395" text-anchor="middle" font-size="12" font-weight="bold" fill="#15212e">P</text></g><g><circle cx="160" cy="390" r="24" fill="#185d8b" stroke="#fff" stroke-width="3"/><text x="160" y="397" text-anchor="middle" font-size="24" fill="white" font-family="sans-serif">D</text></g><rect width="1024" height="32" fill="#162839"/><text x="16" y="23" fill="#fff" font-family="sans-serif" font-size="18">Industrial / B · Rail crossing — HUD reservation 0–31</text><rect y="768" width="1024" height="52" fill="#f3f4ed"/><text x="14" y="788" fill="#15212e" font-size="15" font-family="sans-serif">D deployment · C commanders · S infantry · SP specialist · RB robot · O terminal · R survivors · X exit · L relief</text><text x="14" y="809" fill="#15212e" font-size="15" font-family="sans-serif">N nest · E bug · T troops · TK tank · P plasma · V vent · A ambush · H heat · light clear / dark blocked · schematic</text></g><g transform="translate(1024,48) scale(.5)"><title>Industrial C · Horseshoe foundry</title><desc>Authored schematic. Blocking terrain surrounds clear route corridors; main teal solid, flank violet dashed. Interior maintenance shortcut gives support a protected staging bay instead of an exposed west hub. Both objective ends demand outward pushes; interior diagonal exit opens a second flank on support.</desc><rect width="1024" height="768" fill="#39434b"/><g stroke