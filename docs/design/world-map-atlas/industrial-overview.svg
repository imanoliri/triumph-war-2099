<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 470"><rect width="1536" height="470" fill="#f3f4ed"/><text x="16" y="28" font-size="24" font-family="sans-serif">Industrial · Three authored tactical alternatives</text><g transform="translate(0,48) scale(.5)"><title>Industrial A · Conveyor braid</title><desc>Authored schematic. Blocking terrain surrounds clear route corridors; main teal solid, flank violet dashed. Two long assembly aisles linked by end bays give tank turning room and alternating long-range positions. Aisle interiors expose infantry; clearing late births means another full aisle traversal.</desc><rect width="1024" height="768" fill="#39434b"/><g stroke="#b4a479" stroke-width="144" stroke-linecap="round"><path d="M150,620L380,620"/><path d="M380,620L380,170"/><path d="M380,170L640,170"/><path d="M640,170L640,620"/><path d="M640,620L870,620"/><path d="M870,620L870,170"/><path d="M640,170L870,170"/><path d="M380,620L640,620"/></g><g fill="#b4a479"><circle cx="150" cy="620" r="88"/><circle cx="380" cy="620" r="88"/><circle cx="380" cy="170" r="88"/><circle cx="640" cy="170" r="88"/><circle cx="640" cy="620" r="88"/><circle cx="870" cy="620" r="88"/><circle cx="870" cy="170" r="88"/></g><g stroke="#ffffff" stroke-opacity=".1" stroke-width="1"><path d="M128,32V768"/><path d="M256,32V768"/><path d="M384,32V768"/><path d="M512,32V768"/><path d="M640,32V768"/><path d="M768,32V768"/><path d="M896,32V768"/><path d="M0,128H1024"/><path d="M0,256H1024"/><path d="M0,384H1024"/><path d="M0,512H1024"/><path d="M0,640H1024"/></g><polyline points="150,620 380,620 380,170 640,170 870,170" fill="none" stroke="#187d82" stroke-width="7" /><polyline points="150,620 380,620 640,620 870,620 870,170" fill="none" stroke="#7652a3" stroke-width="7" stroke-dasharray="16 9"/><g fill="none" stroke="#d37059" stroke-width="3" stroke-dasharray="4 5"><circle cx="380" cy="620" r="77"/><circle cx="380" cy="170" r="77"/><circle cx="640" cy="170" r="77"/><circle cx="640" cy="620" r