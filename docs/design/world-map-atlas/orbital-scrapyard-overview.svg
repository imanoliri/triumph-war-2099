="sans-serif">D</text></g><rect width="1024" height="32" fill="#162839"/><text x="16" y="23" fill="#fff" font-family="sans-serif" font-size="18">Orbital Scrapyard / A · Boarding zigzag — HUD reservation 0–31</text><rect y="768" width="1024" height="52" fill="#f3f4ed"/><text x="14" y="788" fill="#15212e" font-size="15" font-family="sans-serif">D deployment · C commanders · S infantry · SP specialist · RB robot · O terminal · R survivors · X exit · L relief</text><text x="14" y="809" fill="#15212e" font-size="15" font-family="sans-serif">N nest · E bug · T troops · TK tank · P plasma · V vent · A ambush · H heat · light clear / dark blocked · schematic</text></g><g transform="translate(512,48) scale(.5)"><title>Orbital Scrapyard B · Salvage wheel</title><desc>Authored schematic. Blocking terrain surrounds clear route corridors; main teal solid, flank violet dashed. Rectangular port hull and triangular starboard wreck create different assault circuits: western gallery to upper relay or lower cargo tether to the eastern relay. The shared middle boarding bay has four mouths; the diagonal top tether creates crossfire on the eastern cargo route.</desc><rect width="1024" height="768" fill="#333743"/><g stroke="#b9a7a1" stroke-width="144" stroke-linecap="round"><path d="M150,620L150,170"/><path d="M150,170L440,170"/><path d="M440,170L440,390"/><path d="M440,390L440,620"/><path d="M440,620L150,620"/><path d="M440,620L740,620"/><path d="M740,620L760,390"/><path d="M760,390L870,170"/><path d="M870,170L440,390"/><path d="M440,390L760,390"/></g><g fill="#b9a7a1"><circle cx="150" cy="620" r="88"/><circle cx="150" cy="170" r="88"/><circle cx="440" cy="170" r="88"/><circle cx="440" cy="620" r="88"/><circle cx="740" cy="620" r="88"/><circle cx="870" cy="170" r="88"/><circle cx="440" cy="390" r="88"/><circle cx="760" cy="390" r="88"/></g><g stroke="#ffffff" stroke-opacity=".1" stroke-width="1"><path d="M128,32V768"/><path d="M256,32V768"/><path d="M384,32V768"/><path d="M512,32V768"/>