cking terrain surrounds clear route corridors; main teal solid, flank violet dashed. Overlapping rings offer two attack circuits and several local retreat choices without one central island. Ring junction is exposed; late nest clearance may force circling after objectives activate.</desc><rect width="1024" height="768" fill="#23384f"/><g stroke="#99bac8" stroke-width="144" stroke-linecap="round"><path d="M160,390L390,170"/><path d="M390,170L630,170"/><path d="M630,170L630,390"/><path d="M630,390L390,620"/><path d="M390,620L160,390"/><path d="M630,390L870,620"/><path d="M870,620L870,170"/><path d="M870,170L630,170"/></g><g fill="#99bac8"><circle cx="160" cy="390" r="88"/><circle cx="390" cy="170" r="88"/><circle cx="630" cy="170" r="88"/><circle cx="630" cy="390" r="88"/><circle cx="390" cy="620" r="88"/><circle cx="870" cy="620" r="88"/><circle cx="870" cy="170" r="88"/></g><g stroke="#ffffff" stroke-opacity=".1" stroke-width="1"><path d="M128,32V768"/><path d="M256,32V768"/><path d="M384,32V768"/><path d="M512,32V768"/><path d="M640,32V768"/><path d="M768,32V768"/><path d="M896,32V768"/><path d="M0,128H1024"/><path d="M0,256H1024"/><path d="M0,384H1024"/><path d="M0,512H1024"/><path d="M0,640H1024"/></g><polyline points="160,390 390,170 630,170 870,170" fill="none" stroke="#187d82" stroke-width="7" /><polyline points="160,390 390,620 630,390 870,620" fill="none" stroke="#7652a3" stroke-width="7" stroke-dasharray="16 9"/><g fill="none" stroke="#d37059" stroke-width="3" stroke-dasharray="4 5"><circle cx="390" cy="170" r="77"/><circle cx="630" cy="170" r="77"/><circle cx="630" cy="390" r="77"/><circle cx="390" cy="620" r="77"/><circle cx="870" cy="620" r="77"/><circle cx="870" cy="170" r="77"/></g><g><title>objective O1</title><rect x="857" y="157" width="26" height="26" fill="#f6de65" stroke="#15212e" stroke-width="2"/><text x="870" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#15212e">O1</text></g><g><title>objective O2</title><rect x="857" y