<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 470"><rect width="1536" height="470" fill="#f3f4ed"/><text x="16" y="28" font-size="24" font-family="sans-serif">Floating Habitats · Three authored tactical alternatives</text><g transform="translate(0,48) scale(.5)"><title>Floating Habitats A · Branching bridge lattice</title><desc>Authored schematic. Blocking terrain surrounds clear route corridors; main teal solid, flank violet dashed. Immediate three-way deployment choice: short exposed middle transfer to altitude terminal, or bent southern circuit collecting tank supply before climate control. North circuit flanks the dock. Middle transfer faces upper and lower junction threats; committing to the south circuit delays support for the exposed east dock.</desc><rect width="1024" height="768" fill="#23384f"/><g stroke="#99bac8" stroke-width="144" stroke-linecap="round"><path d="M160,390L410,160"/><path d="M410,160L650,160"/><path d="M650,160L870,390"/><path d="M870,390L650,620"/><path d="M650,620L410,620"/><path d="M410,620L160,390"/><path d="M160,390L410,390"/><path d="M410,390L650,390"/><path d="M650,390L870,390"/><path d="M650,390L650,160"/><path d="M650,390L650,620"/></g><g fill="#99bac8"><circle cx="160" cy="390" r="88"/><circle cx="410" cy="160" r="88"/><circle cx="650" cy="160" r="88"/><circle cx="870" cy="390" r="88"/><circle cx="650" cy="620" r="88"/><circle cx="410" cy="620" r="88"/><circle cx="410" cy="390" r="88"/><circle cx="650" cy="390" r="88"/></g><g stroke="#ffffff" stroke-opacity=".1" stroke-width="1"><path d="M128,32V768"/><path d="M256,32V768"/><path d="M384,32V768"/><path d="M512,32V768"/><path d="M640,32V768"/><path d="M768,32V768"/><path d="M896,32V768"/><path d="M0,128H1024"/><path d="M0,256H1024"/><path d="M0,384H1024"/><path d="M0,512H1024"/><path d="M0,640H1024"/></g><polyline points="160,390 410,390 650,390 870,390" fill="none" stroke="#187d82" stroke-width="7" /><polyline points="160,390 410,620 650,620" fill="none" stroke="#7652