oke-width="2"/><text x="442" y="625" text-anchor="middle" font-size="12" font-weight="bold" fill="#15212e">TK</text></g><g><title>weapon P</title><rect x="429" y="377" width="26" height="26" fill="#a086ce" stroke="#15212e" stroke-width="2"/><text x="442" y="395" text-anchor="middle" font-size="12" font-weight="bold" fill="#15212e">P</text></g><g><circle cx="160" cy="390" r="24" fill="#185d8b" stroke="#fff" stroke-width="3"/><text x="160" y="397" text-anchor="middle" font-size="24" fill="white" font-family="sans-serif">D</text></g><rect width="1024" height="32" fill="#162839"/><text x="16" y="23" fill="#fff" font-family="sans-serif" font-size="18">Floating Habitats / A · Branching bridge lattice — HUD reservation 0–31</text><rect y="768" width="1024" height="52" fill="#f3f4ed"/><text x="14" y="788" fill="#15212e" font-size="15" font-family="sans-serif">D deployment · C commanders · S infantry · SP specialist · RB robot · O terminal · R survivors · X exit · L relief</text><text x="14" y="809" fill="#15212e" font-size="15" font-family="sans-serif">N nest · E bug · T troops · TK tank · P plasma · V vent · A ambush · H heat · light clear / dark blocked · schematic</text></g><g transform="translate(512,48) scale(.5)"><title>Floating Habitats B · Dock tower chain</title><desc>Authored schematic. Blocking terrain surrounds clear route corridors; main teal solid, flank violet dashed. Vertical tower chain gives Defender successive short firing positions; diagonal service bridge bypasses upper towers. First transfer is compulsory; tank relief needs the long lower dock route.</desc><rect width="1024" height="768" fill="#23384f"/><g stroke="#99bac8" stroke-width="144" stroke-linecap="round"><path d="M150,170L150,620"/><path d="M150,620L440,620"/><path d="M440,620L440,170"/><path d="M440,170L720,170"/><path d="M720,170L870,390"/><path d="M870,390L870,620"/><path d="M870,620L440,620"/><path d="M440,170L870,390"/></g><g fill="#99bac8"><circle cx="150" cy="170" r="88"/><circle cx="1